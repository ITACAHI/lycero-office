name: Release Build & Sign (Windows, macOS, Linux)

# Zero-key source pipeline: builds official desktop installers across Windows,
# macOS, and Linux. Signing credentials exist ONLY in GitHub Encrypted Secrets
# (or SignPath cloud HSM) and are never stored in the repository.
# If signing secrets are not yet configured, the workflow still builds unsigned
# installers cleanly so CI verification never blocks.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Enable code signing if repository secrets are configured'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  hygiene-gate:
    name: Security & Public Hygiene Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run public-repo secret & hygiene gate
        run: node tools/check-public-hygiene.mjs

      - name: Verify lockstep version synchronization across all modules
        run: node tools/check-version-sync.mjs

      - name: Check production dependency licenses
        run: node tools/check-licenses.mjs

      - name: Resolve release version from package.json
        id: meta
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows (x64 & 32-bit ia32 NSIS)
    needs: hygiene-gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (xlsx-sidecar x64 & ia32)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Package Windows 64-bit (x64) Installer
        env:
          LYCERO_UPDATE_URL: ${{ secrets.LYCERO_UPDATE_URL }}
          LYCERO_FONT_CDN_URL: ${{ secrets.LYCERO_FONT_CDN_URL }}
          LYCERO_GA4_MEASUREMENT_ID: ${{ secrets.LYCERO_GA4_MEASUREMENT_ID }}
          LYCERO_GA4_API_SECRET: ${{ secrets.LYCERO_GA4_API_SECRET }}
          LYCERO_WIN_SIGN_MODE: ${{ inputs.sign == false && 'none' || '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_DLIB: ${{ secrets.AZURE_TRUSTED_SIGNING_DLIB }}
          AZURE_TRUSTED_SIGNING_METADATA: ${{ secrets.AZURE_TRUSTED_SIGNING_METADATA }}
          SM_KEYPAIR_ALIAS: ${{ secrets.SM_KEYPAIR_ALIAS }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - name: Package Windows 32-bit (ia32) Installer
        env:
          LYCERO_UPDATE_URL: ${{ secrets.LYCERO_UPDATE_URL }}
          LYCERO_FONT_CDN_URL: ${{ secrets.LYCERO_FONT_CDN_URL }}
          LYCERO_GA4_MEASUREMENT_ID: ${{ secrets.LYCERO_GA4_MEASUREMENT_ID }}
          LYCERO_GA4_API_SECRET: ${{ secrets.LYCERO_GA4_API_SECRET }}
          LYCERO_WIN_SIGN_MODE: ${{ inputs.sign == false && 'none' || '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_DLIB: ${{ secrets.AZURE_TRUSTED_SIGNING_DLIB }}
          AZURE_TRUSTED_SIGNING_METADATA: ${{ secrets.AZURE_TRUSTED_SIGNING_METADATA }}
          SM_KEYPAIR_ALIAS: ${{ secrets.SM_KEYPAIR_ALIAS }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win:ia32

      - name: Consolidate Windows x64 and 32-bit ia32 artifacts
        shell: pwsh
        run: |
          Copy-Item -Path "apps/shell/release-ia32/*.exe" -Destination "apps/shell/release/" -Force
          Copy-Item -Path "apps/shell/release-ia32/*.exe.blockmap" -Destination "apps/shell/release/" -Force
          Get-ChildItem -Path "apps/shell/release"

      - name: Upload Windows Release Artifacts (x64 & 32-bit ia32)
        uses: actions/upload-artifact@v4
        with:
          name: lycero-office-windows-x64-ia32
          path: |
            apps/shell/release/*.exe
            apps/shell/release/*.exe.blockmap
            apps/shell/release/latest.yml

  build-macos:
    name: Build macOS (Apple Silicon ARM64 + Intel x64 DMG/ZIP)
    needs: hygiene-gate
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (xlsx-sidecar universal)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Package macOS Installers (ARM64 + Intel x64; Ad-hoc when Apple cert is unset)
        env:
          LYCERO_MAC_X64: '1'
          LYCERO_UPDATE_URL: ${{ secrets.LYCERO_UPDATE_URL }}
          LYCERO_FONT_CDN_URL: ${{ secrets.LYCERO_FONT_CDN_URL }}
          LYCERO_GA4_MEASUREMENT_ID: ${{ secrets.LYCERO_GA4_MEASUREMENT_ID }}
          LYCERO_GA4_API_SECRET: ${{ secrets.LYCERO_GA4_API_SECRET }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Upload macOS Release Artifacts (ARM64 + Intel x64)
        uses: actions/upload-artifact@v4
        with:
          name: lycero-office-macos-universal-arm64-x64
          path: |
            apps/shell/release/*.dmg
            apps/shell/release/*.zip
            apps/shell/release/latest-mac.yml

  build-linux:
    name: Build Linux (x64 AppImage, DEB, RPM)
    needs: hygiene-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (xlsx-sidecar)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install Linux packaging tools (rpmbuild)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Install dependencies
        run: npm ci

      - name: Package Linux Installers (.AppImage, .deb, .rpm)
        env:
          LYCERO_UPDATE_URL: ${{ secrets.LYCERO_UPDATE_URL }}
          LYCERO_FONT_CDN_URL: ${{ secrets.LYCERO_FONT_CDN_URL }}
          LYCERO_GA4_MEASUREMENT_ID: ${{ secrets.LYCERO_GA4_MEASUREMENT_ID }}
          LYCERO_GA4_API_SECRET: ${{ secrets.LYCERO_GA4_API_SECRET }}
        run: npm run dist:linux

      - name: Sign Linux packages with GPG (when GPG_PRIVATE_KEY secret is present)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "No GPG_PRIVATE_KEY secret configured; skipping GPG detach-sign."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for pkg in apps/shell/release/*.deb apps/shell/release/*.rpm apps/shell/release/*.AppImage; do
            [ -f "$pkg" ] || continue
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$pkg"
          done

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lycero-office-linux-x64
          path: |
            apps/shell/release/*.AppImage*
            apps/shell/release/*.deb*
            apps/shell/release/*.rpm*
            apps/shell/release/latest-linux.yml

  publish-release:
    name: Publish Installers to GitHub Releases
    needs:
      - hygiene-gate
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          PKG_TAG: ${{ needs.hygiene-gate.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          TAG="$PKG_TAG"
          if [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG="$REF_NAME"
          fi
          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GH_REPO" --target "$GH_SHA" --latest --title "Lycero Office $TAG" --notes "Official multi-platform installers for Windows (x64 & 32-bit ia32), macOS (Apple Silicon ARM64 & Intel x64), and Linux (AppImage, DEB, RPM)."
          fi
          mapfile -t ASSETS < <(find release-assets -type f | sort)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets found in release-assets/" >&2
            exit 1
          fi
          printf 'Uploading %s\n' "${ASSETS[@]}"
          gh release upload "$TAG" "${ASSETS[@]}" --repo "$GH_REPO" --clobber
