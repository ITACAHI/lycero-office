<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lycero Office Update</title>
    <style>
      :root {
        --accent: #8b3a1a;
        --accent-hover: #722e14;
        --bg-surface: #f9f8f3;
        --bg-header: #f4f2eb;
        --text: #1c1b18;
        --text-muted: #6b675e;
        --border: #ddd9ce;
        --ui-cjk: 'Be Vietnam Pro', 'Segoe UI', 'Microsoft YaHei', 'PingFang SC';
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: 'Be Vietnam Pro', -apple-system, 'Segoe UI', var(--ui-cjk), sans-serif;
        color: var(--text);
        background: transparent;
        user-select: none;
        -webkit-app-region: drag;
      }
      #card {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg-surface);
        border-radius: 12px;
        border: 1px solid var(--border);
        overflow: hidden;
      }
      #hero {
        background: var(--bg-header);
        border-bottom: 1px solid var(--border);
        padding: 28px 0 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      #hero img {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        border: 1px solid var(--border);
      }
      #headline {
        color: var(--text);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      #versions {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        font-size: 12.5px;
      }
      #versions .chip {
        background: #eae6dc;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 10px;
        font-variant-numeric: tabular-nums;
      }
      #versions .chip.new {
        background: rgba(139, 58, 26, 0.12);
        border-color: rgba(139, 58, 26, 0.28);
        color: var(--accent);
        font-weight: 600;
      }
      #body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 22px 28px 20px;
      }
      #desc {
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-muted);
        text-align: center;
      }
      #desc.error {
        color: #b3261e;
      }
      #action {
        -webkit-app-region: no-drag;
        width: 100%;
        height: 44px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #action:hover {
        background: var(--accent-hover);
      }
      #progress {
        width: 100%;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      #progress .track {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: #eae6dc;
        overflow: hidden;
      }
      #progress .bar {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: var(--accent);
        transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #progress .label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      #later {
        -webkit-app-region: no-drag;
        background: none;
        border: none;
        font-size: 12px;
        color: var(--text-muted);
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      #later:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="hero">
        <img src="./src/assets/app-icon.png" alt="Lycero Office" />
        <div id="headline"></div>
        <div id="versions">
          <span class="chip" id="ver-current"></span>
          <span>→</span>
          <span class="chip new" id="ver-new"></span>
        </div>
      </div>
      <div id="body">
        <div id="desc"></div>
        <div id="progress">
          <div class="track"><div class="bar" id="bar"></div></div>
          <div class="label"><span id="progress-text"></span><span id="percent"></span></div>
        </div>
        <button id="action"></button>
        <button id="later"></button>
      </div>
    </div>
    <script type="module" src="/src/update.ts"></script>
  </body>
</html>
